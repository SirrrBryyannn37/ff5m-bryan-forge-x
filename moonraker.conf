# Bryan Forge X Moonraker — lean, Fluidd-only, your OTA channel

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /tmp/uds
max_websocket_connections: 8

[klippy_apis]
hidden_objects:
    output_pin level_h1
    output_pin level_h2
    output_pin level_h3
    output_pin level_clear
    output_pin power_off
    output_pin clear_power_off

[machine]
provider: simple
script_path: /opt/config/mod/.root/
validate_service: false
validate_config: false

[file_manager]
file_system_observer: none
enable_object_processing: false
queue_gcode_uploads: false
excludes:
    gcodes/.mod
    gcodes/logFiles
    gcodes/lost+found
    config/mod/.py
    config/mod/.root
    config/mod/.shell
    config/mod/.zsh
    config/mod_data/log
    config/mod_data/database

[data_store]
temperature_store_size: 120
gcode_store_size: 80

[authorization]
enable_api_key: false

[octoprint_compat]
enable_ufp: false
webcam_enabled: false

[announcements]
subscriptions: []

[update_manager]
enable_auto_refresh: False
enable_system_updates: False

[update_manager forge-x]
type: git_repo
path: /root/printer_data/config/mod/
origin: https://github.com/SirrrBryyannn37/ff5m-bryan-forge-x.git
primary_branch: bryan-forge-x
managed_services: forge-x

[update_manager fluidd]
type: web
repo: fluidd-core/fluidd
path: /root/www/fluidd

[include mod_data/user.moonraker.conf]