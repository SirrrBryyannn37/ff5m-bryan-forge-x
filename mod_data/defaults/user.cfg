# Bryan Forge X — mod_data/user.cfg (shipped in firmware fork)
# 0.6 mm stock nozzle baseline | Conch 0.8 overlay available separately

[printer]
max_velocity: 650
max_accel: 12000
max_accel_to_decel: 6000
square_corner_velocity: 14

[extruder]
pressure_advance: 0.048
pressure_advance_smooth_time: 0.030
max_extrude_cross_section: 2.5
max_extrude_only_velocity: 120

[heater_fan heat_fan]
heater_temp: 50.0

[tmc2209 extruder]
run_current: 0.90
hold_current: 0.85

[pause_resume]
recover_velocity: 200

[firmware_retraction]
retract_length: 0.75
retract_speed: 60
unretract_extra_length: 0.0
unretract_speed: 60

[bed_mesh]
speed: 500
mesh_pps: 2, 2
probe_count: 4, 4

[probe]
speed: 3.5
samples: 3
samples_tolerance: 0.05
samples_tolerance_retries: 3

[idle_timeout]
timeout: 300

[include bfx_print_safe.cfg]
[include bfx_material_macros.cfg]

# Uncomment after installing the Phaetus Conch + 0.8mm brass nozzle.
# Must stay LAST so its extruder/retraction/current values win over the
# 0.6mm baseline above.
# [include bfx_conch_0.8.cfg]