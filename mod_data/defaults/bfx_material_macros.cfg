# Bryan-X-Forge material tune macros — included from user.cfg
# Run from Fluidd or call from filament start gcode

[gcode_macro BFX_AUTO_HOME]
description: Home all axes when idle (Bryan-X-Forge watchdog)
gcode:
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
    M117 BFX auto-home done
  {% else %}
    M117 Already homed
  {% endif %}

[gcode_macro BFX_TUNE_PLA]
description: Bryan-X-Forge material PA + retraction
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.04
  SET_RETRACTION RETRACT_LENGTH=0.6 RETRACT_SPEED=60 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=60
  M117 BFX_TUNE_PLA PA=0.04

[gcode_macro BFX_TUNE_PLA_RAPID]
description: Bryan Forge X PLA high-speed (lower PA, shorter retract)
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.038
  SET_RETRACTION RETRACT_LENGTH=0.55 RETRACT_SPEED=65 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=65
  M117 BFX PLA Rapid PA=0.038

[gcode_macro BFX_TUNE_PETG]
description: Bryan-X-Forge material PA + retraction
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.048
  SET_RETRACTION RETRACT_LENGTH=0.75 RETRACT_SPEED=60 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=60
  M117 BFX_TUNE_PETG PA=0.048

[gcode_macro BFX_TUNE_PETG_STD]
description: Bryan-X-Forge material PA + retraction
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.05
  SET_RETRACTION RETRACT_LENGTH=0.75 RETRACT_SPEED=60 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=60
  M117 BFX_TUNE_PETG_STD PA=0.05

[gcode_macro BFX_TUNE_PETG_CF]
description: Bryan-X-Forge material PA + retraction
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.052
  SET_RETRACTION RETRACT_LENGTH=0.75 RETRACT_SPEED=60 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=60
  M117 BFX_TUNE_PETG_CF PA=0.052

# --- Phaetus Conch 0.8mm variants ------------------------------------------
# Larger nozzles generally run lower pressure advance than 0.4/0.6mm for the
# same corner quality, and this hotend's bigger melt chamber wants a touch
# more retraction than the 0.6mm baseline (see bfx_conch_0.8.cfg). These are
# starting points -- re-tune with a PA tower / retraction tower once the
# Conch + 0.8mm brass nozzle is installed and bfx_conch_0.8.cfg is included.

[gcode_macro BFX_TUNE_PLA_CONCH08]
description: Bryan Forge X PLA tune for Conch 0.8mm nozzle
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.030
  SET_RETRACTION RETRACT_LENGTH=0.9 RETRACT_SPEED=70 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=70
  M117 BFX_TUNE_PLA_CONCH08 PA=0.030

[gcode_macro BFX_TUNE_PETG_CONCH08]
description: Bryan Forge X PETG tune for Conch 0.8mm nozzle
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.036
  SET_RETRACTION RETRACT_LENGTH=0.9 RETRACT_SPEED=70 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=70
  M117 BFX_TUNE_PETG_CONCH08 PA=0.036

[gcode_macro BFX_TUNE_PETG_CF_CONCH08]
description: Bryan Forge X PETG-CF tune for Conch 0.8mm nozzle
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.040
  SET_RETRACTION RETRACT_LENGTH=0.9 RETRACT_SPEED=70 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=70
  M117 BFX_TUNE_PETG_CF_CONCH08 PA=0.040
