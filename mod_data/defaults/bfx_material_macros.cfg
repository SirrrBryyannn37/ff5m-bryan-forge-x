# Bryan-X-Forge material tune macros — included from user.cfg
# Run from Fluidd or call from filament start gcode

[gcode_macro BFX_AUTO_HOME]
description: Home all axes when idle (Bryan-X-Forge watchdog)
gcode:
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
    M117 BFX auto-home done
  {% else %}
    M117 Already homed
  {% endif %}

[gcode_macro BFX_TUNE_PLA]
description: Bryan-X-Forge material PA + retraction
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.04
  SET_RETRACTION RETRACT_LENGTH=0.6 RETRACT_SPEED=60 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=60
  M117 BFX_TUNE_PLA PA=0.04

[gcode_macro BFX_TUNE_PLA_RAPID]
description: Bryan Forge X PLA high-speed (lower PA, shorter retract)
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.038
  SET_RETRACTION RETRACT_LENGTH=0.55 RETRACT_SPEED=65 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=65
  M117 BFX PLA Rapid PA=0.038

