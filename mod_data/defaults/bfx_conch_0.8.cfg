# Enable after Phaetus Conch + 0.8 mm brass install
# Add to the end of mod_data/user.cfg: [include bfx_conch_0.8.cfg]
# (must be included AFTER bfx_print_safe.cfg / bfx_material_macros.cfg so
# these values are the ones that win)
#
# Starting points only -- verify with your own PA tower / retraction tower /
# flow calibration before relying on this for production prints.

[extruder]
nozzle_diameter: 0.800
# KAMP's Line_Purge.cfg silently skips purging if max_extrude_cross_section
# < 5 (see KAMP/Line_Purge.cfg). The stock 0.6mm baseline (2.5) and the old
# Conch value here (3.2) were both below that floor -- KAMP is on by default
# in this fork (variables.bfx.cfg: use_kamp=1), so purge was being skipped
# silently on Conch. 10 clears the floor with headroom for the bigger
# per-move volume an 0.8mm nozzle pushes during priming/purging.
max_extrude_cross_section: 10
max_extrude_only_velocity: 120
# Larger nozzles typically need less pressure advance than 0.4/0.6mm for
# equivalent corner quality; 0.04 is a reasonable starting point, same as
# before. Re-tune with a PA tower once printing.
pressure_advance: 0.040

[firmware_retraction]
# Conch's melt chamber is bigger than the stock hotend's; a touch more
# retraction than the 0.75mm baseline is a common starting point. Re-tune
# with a retraction tower.
retract_length: 0.9
retract_speed: 70
unretract_extra_length: 0.0
unretract_speed: 70

[tmc2209 extruder]
# 0.8mm sustains much higher volumetric flow than the stock nozzle; bump
# extruder current a little so it doesn't skip steps at higher flow rates.
# Watch stepper temperature after raising this.
run_current: 0.95
hold_current: 0.85

[printer]
square_corner_velocity: 16

[pause_resume]
recover_velocity: 250
